<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MeechyLand — Mila’s World</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #1a0a2e 0%, #2d1b4e 50%, #0f172a 100%);
    color: #f8f0ff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: rgba(30, 15, 50, 0.75);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 180, 255, 0.25);
    border-radius: 24px;
    padding: 40px 48px;
    max-width: 520px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 2.8rem;
    margin: 0 0 8px;
    background: linear-gradient(90deg, #ff9ecf, #c084fc, #a5b4fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .subtitle { color: #e9d5ff; font-size: 1.15rem; margin-bottom: 28px; }
  .btn {
    display: inline-block;
    background: linear-gradient(90deg, #ec4899, #a855f7);
    color: white;
    font-size: 1.2rem;
    font-weight: 600;
    padding: 14px 36px;
    border-radius: 999px;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .btn:hover { transform: scale(1.04); }
  .note { margin-top: 24px; font-size: 0.9rem; color: #d8b4fe; }
  .skin-preview { margin: 20px auto; width: 64px; height: 64px; image-rendering: pixelated; }
</style>
</head>
<body>
  <div class="card">
    <h1>MeechyLand</h1>
    <div class="subtitle">Mila’s special world — fly, build, and never die</div>
    <img class="skin-preview" src="mila_skin.png" alt="Mila skin" />
    <br>
    <a class="btn" href="play.html">Play MeechyLand</a>
    <div class="note">
      Type your name as <strong>Mila</strong> when you join.<br>
      Grown-ups: see the guides in this folder.
    </div>
  </div>
</body>
</html>
